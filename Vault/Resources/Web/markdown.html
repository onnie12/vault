<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Documents are data, never code (CLAUDE.md section 10). Markdown may contain raw
  HTML, so this policy only runs the bundled script files: inline scripts,
  event handlers like onerror= and javascript: links are all blocked.
  Images may still load from the web, the same as any document would.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'; font-src file:; img-src file: data: https: http:">
<link rel="stylesheet" href="katex.min.css">
<link rel="stylesheet" href="highlight-light.min.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="highlight-dark.min.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="markdown.css">
<script src="marked.umd.js"></script>
<script src="highlight.min.js"></script>
<script src="highlight-powershell.min.js"></script>
<script src="katex.min.js"></script>
<script src="markdown.js"></script>
</head>
<body>
<main id="content"></main>
</body>
</html>
